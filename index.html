<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transpo Board</title>
<style>
  :root{
    --paper:#EFE7D4;
    --paper-2:#E7DCC4;
    --card:#FBF7EC;
    --card-2:#F6EFDD;
    --ink:#2A2218;
    --ink-2:#3A342A;
    --ink-soft:#5A5140;
    --line:#CBBF9F;
    --line-soft:#DED2B4;
    --line-strong:#4A4234;
    --orange:#CE5A2F;
    --orange-d:#A8431C;
    --red:#BE3A2B;
    --blue:#2C5C9E;
    --blue-l:#5B84BE;
    --green:#2E7D4F;
    --amber:#B9820F;
    --gray:#867A62;
    --shadow:0 1px 3px rgba(25,21,16,.08),0 6px 16px -10px rgba(25,21,16,.22);
    --shadow-lg:0 14px 40px -18px rgba(25,21,16,.40),0 2px 8px -4px rgba(25,21,16,.14);
    --mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
    --disp:"Helvetica Neue",'Arial Narrow',"Arial Narrow",Helvetica,sans-serif;
    --rad:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, #F6EFDD 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    font-size:14px;line-height:1.42;
    -webkit-font-smoothing:antialiased;
    padding-bottom:72px;
    min-height:100vh;
  }
  ::selection{background:var(--orange);color:#fff}

  /* ---------- header ---------- */
  header{
    background:linear-gradient(180deg,#3A2F1F,#2A2213);
    color:var(--paper);
    border-bottom:2px solid rgba(206,90,47,.5);
    position:sticky;top:0;z-index:40;
    box-shadow:0 12px 30px -24px rgba(25,21,16,.85);
  }
  .head-top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 22px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:14px}
  .brand h1{
    font-family:var(--disp);font-weight:800;letter-spacing:.13em;
    text-transform:uppercase;font-size:24px;margin:0;
    display:flex;align-items:center;gap:11px;
  }
  .brand h1 .beacon{
    width:11px;height:11px;border-radius:50%;background:var(--orange);
    box-shadow:0 0 0 0 rgba(220,90,42,.7);animation:beacon 2.4s infinite;
    flex:none;
  }
  @keyframes beacon{
    0%{box-shadow:0 0 0 0 rgba(220,90,42,.6)}
    70%{box-shadow:0 0 0 10px rgba(220,90,42,0)}
    100%{box-shadow:0 0 0 0 rgba(220,90,42,0)}
  }
  .brand .tag{
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:#B7A986;
  }
  .clock{text-align:right;font-size:11px;letter-spacing:.12em;line-height:1.5;color:#C9BEA3}
  .clock .big{font-size:22px;font-weight:700;letter-spacing:.12em;color:#fff;font-variant-numeric:tabular-nums}
  .clock .big .sec{color:var(--orange);font-size:15px}
  nav{
    display:flex;gap:0;padding:0 14px;border-top:1px solid #322c22;align-items:stretch;
  }
  nav button.tab{
    background:none;border:none;color:#B7A986;font-family:var(--disp);
    text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;font-weight:700;
    padding:12px 20px;cursor:pointer;border-bottom:3px solid transparent;position:relative;
    transition:color .18s;
  }
  nav button.tab:hover{color:var(--paper)}
  nav button.tab.active{color:#fff}
  nav button.tab.active::after{
    content:"";position:absolute;left:14px;right:14px;bottom:-3px;height:3px;
    background:var(--orange);border-radius:3px 3px 0 0;
  }
  nav button.tab .cnt{
    display:inline-block;margin-left:7px;background:#322c22;color:#E7DCC4;
    font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:9px;font-weight:600;
  }
  nav button.tab .cnt.bad{background:var(--red);color:#fff}

  /* ---------- alert banner ---------- */
  .alerts{padding:12px 22px 14px;border-bottom:1px solid var(--line-soft);box-shadow:0 10px 22px -18px rgba(42,34,24,.4);position:relative;overflow:hidden}
  .alerts.sev-ok{background:#EAF1E5;border-bottom-color:var(--green)}
  .alerts.sev-warn{background:#F5EEDD;border-bottom-color:var(--amber)}
  .alerts.sev-crit{background:#F4E9E4;border-bottom-color:var(--red)}
  .alerts .ah{
    margin:0 0 7px;font-family:var(--disp);text-transform:uppercase;
    letter-spacing:.13em;font-size:12.5px;display:flex;align-items:center;gap:10px;font-weight:800;
  }
  .alerts.sev-ok .ah{color:var(--green)}
  .alerts.sev-warn .ah{color:var(--amber)}
  .alerts.sev-crit .ah{color:var(--red)}
  .alerts .ah .sevcounts{display:flex;gap:6px;margin-left:auto;font-family:var(--mono);letter-spacing:.02em}
  .sevpill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:10px;border:1.5px solid;text-transform:none;letter-spacing:.02em;cursor:pointer;font-family:var(--mono);transition:.14s}
  .sevpill:hover{transform:translateY(-1px)}
  .sevpill.all{color:var(--ink);border-color:var(--line-strong);background:#fff}
  .sevpill.all.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .sevpill.c{color:var(--red);border-color:var(--red);background:#fff}
  .sevpill.w{color:var(--amber);border-color:var(--amber);background:#fff}
  .sevpill.i{color:var(--blue);border-color:var(--blue);background:#fff}
  .sevpill.c.sel{background:var(--red);color:#fff}
  .sevpill.w.sel{background:var(--amber);color:#fff}
  .sevpill.i.sel{background:var(--blue);color:#fff}
  .alerttoggle{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:10px;padding:3px 10px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink-soft);cursor:pointer;transition:.14s}
  .alerttoggle:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .alerts ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:6px 14px}
  .alerts li{font-size:12.5px;display:flex;gap:9px;align-items:flex-start;padding:7px 11px;border-radius:9px;background:rgba(255,253,247,.6);border-left:4px solid var(--gray);box-shadow:0 1px 2px rgba(25,21,16,.05)}
  .alerts li .tick{font-weight:800;flex:none;line-height:1.35;font-size:15px}
  .alerts li.c{border-left-color:var(--red);background:rgba(190,58,43,.10)}
  .alerts li.w{border-left-color:var(--amber);background:rgba(185,130,15,.13)}
  .alerts li.i{border-left-color:var(--blue);background:rgba(44,92,158,.11)}
  .alerts li.c .tick{color:var(--red)}
  .alerts li.w .tick{color:var(--amber)}
  .alerts li.i .tick{color:var(--blue)}
  .alerts li b{font-weight:700}

  /* ---------- layout ---------- */
  main{max-width:1300px;margin:0 auto;padding:18px 22px}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .datestep{display:flex;align-items:center;gap:8px}
  .datestep .arrow{
    width:34px;height:34px;border:2px solid var(--ink);background:var(--card);
    cursor:pointer;font-size:16px;font-weight:700;border-radius:var(--rad);
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .datestep .arrow:hover{background:var(--ink);color:var(--paper)}
  .datestep .curdate{
    font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;
    font-weight:800;font-size:19px;min-width:250px;text-align:center;line-height:1.12;
  }
  .datestep .curdate small{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--ink-soft);font-weight:700;margin-top:2px}
  .datestep .curdate small.live{color:var(--orange-d)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{
    border:1.5px solid var(--line-strong);background:var(--card);
    padding:6px 12px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    cursor:pointer;border-radius:20px;font-family:var(--disp);font-weight:700;transition:.14s;
  }
  .chip:hover{border-color:var(--ink)}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip .dotc{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .btn{
    border:2px solid var(--ink);background:var(--ink);color:var(--paper);
    font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;
    font-weight:700;font-size:12px;padding:8px 15px;cursor:pointer;border-radius:var(--rad);transition:.15s;
  }
  .btn:hover{background:var(--orange);border-color:var(--orange);transform:translateY(-1px)}
  .btn.ghost{background:var(--card);color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:var(--paper)}

  /* ---------- flight deck stat strip ---------- */
  .deck{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;
  }
  .stat{
    background:var(--card);border:2px solid var(--ink);border-radius:var(--rad);
    padding:11px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gray)}
  .stat.accent-o::before{background:var(--orange)}
  .stat.accent-b::before{background:var(--blue)}
  .stat.accent-g::before{background:var(--green)}
  .stat.accent-r::before{background:var(--red)}
  .stat.accent-a::before{background:var(--amber)}
  .stat .k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;font-family:var(--disp)}
  .stat .v{font-family:var(--disp);font-weight:800;font-size:27px;line-height:1.05;margin-top:3px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
  .stat .sub{font-size:10.5px;color:var(--gray);margin-top:2px}

  /* ---------- timeline (gantt) ---------- */
  .tlwrap{
    background:var(--card);border:2px solid var(--ink);border-radius:var(--rad);
    box-shadow:var(--shadow-lg);margin-bottom:20px;overflow:hidden;
  }
  .tlhead{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 15px;background:var(--ink);color:var(--paper);
  }
  .tlhead .tt{font-family:var(--disp);text-transform:uppercase;letter-spacing:.13em;font-weight:800;font-size:14px;display:flex;align-items:center;gap:9px}
  .tlhead .lg{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--disp);font-weight:700;color:#C9BEA3}
  .tlhead .lg span{display:flex;align-items:center;gap:5px}
  .tlhead .lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .tlbody{padding:6px 0 4px}
  .tlrow{display:grid;grid-template-columns:150px 1fr;align-items:center;border-bottom:1px dashed var(--line-soft)}
  .tlrow:last-child{border-bottom:none}
  .tlrow .rl{padding:8px 12px;min-width:0}
  .tlrow .rl .nm{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tlrow .rl .dv{font-size:10px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .tlrow .rl .dv.warn{color:var(--red);font-weight:700}
  .track{position:relative;height:46px;border-left:1px solid var(--line)}
  .track .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft)}
  .track .gllab{position:absolute;top:2px;font-size:9px;color:var(--gray);transform:translateX(3px);letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .bar{
    position:absolute;top:11px;height:24px;border-radius:6px;cursor:pointer;
    display:flex;align-items:center;padding:0 8px;gap:6px;overflow:hidden;
    border:1.5px solid rgba(0,0,0,.18);transform-origin:left center;
    transition:filter .15s, box-shadow .15s;box-shadow:0 1px 0 rgba(0,0,0,.12);
  }
  .bar:hover{filter:brightness(1.04);box-shadow:0 4px 14px -6px rgba(0,0,0,.5);z-index:5}
  .bar .btime{font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--mono)}
  .bar .bto{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
  .bar.s-staged{background:#E3DBC8;color:#4A4234;border-color:#BBAE8C}
  .bar.s-enroute{background:repeating-linear-gradient(90deg,#3568AE,#3568AE 11px,#3E72BB 11px,#3E72BB 22px);color:#fff;border-color:#264d84;background-size:200% 100%;animation:roll 2.2s linear infinite}
  @keyframes roll{to{background-position:44px 0}}
  .bar.s-onloc{background:#E5732E;color:#fff;border-color:#b8461d}
  .bar.s-wrapped{background:#3A8A5C;color:#fff;border-color:#276b45}
  .bar .transit{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.16),rgba(0,0,0,.16) 4px,transparent 4px,transparent 8px);border-right:1.5px solid rgba(0,0,0,.28)}
  .bar.late{outline:2px solid var(--red);outline-offset:1px}
  .callmark{position:absolute;top:5px;width:2px;height:36px;background:var(--ink);z-index:4}
  .callmark::after{content:"CALL";position:absolute;top:-1px;left:4px;font-size:8px;font-family:var(--disp);font-weight:800;letter-spacing:.08em;color:var(--ink);background:rgba(251,247,236,.85);padding:0 2px;border-radius:2px}
  .nowline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red);z-index:8;pointer-events:none}
  .nowline::before{content:"";position:absolute;top:0;left:-3px;width:8px;height:8px;background:var(--red);border-radius:50%;box-shadow:0 0 0 0 rgba(190,58,43,.6);animation:beacon 2s infinite}
  .nowcol{position:absolute;top:0;bottom:0;width:2px;background:rgba(190,58,43,.5);z-index:6;pointer-events:none}
  .nowcol::after{content:"NOW";position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:8.5px;font-family:var(--disp);font-weight:800;letter-spacing:.1em;color:#fff;background:var(--red);padding:1px 5px;border-radius:3px;white-space:nowrap}
  .tlaxis{position:relative;height:20px;grid-column:2;margin-left:0}
  .tl-empty{padding:30px;text-align:center;color:var(--ink-soft)}

  /* ---------- daily cards ---------- */
  .subhdr{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:800;color:var(--ink-soft);margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .subhdr::after{content:"";flex:1;height:2px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
  .card{
    background:var(--card);border:2px solid var(--ink);border-radius:var(--rad);
    box-shadow:var(--shadow);overflow:hidden;position:relative;
    opacity:0;transform:translateY(10px);animation:rise .4s ease forwards;
  }
  @keyframes rise{to{opacity:1;transform:none}}
  .card.due{outline:3px solid var(--orange);outline-offset:2px;animation:rise .4s ease forwards, dueglow 2.4s ease-in-out infinite 0.4s}
  @keyframes dueglow{0%,100%{box-shadow:var(--shadow),0 0 0 0 rgba(220,90,42,.0)}50%{box-shadow:var(--shadow),0 0 22px -4px rgba(220,90,42,.65)}}
  .card .duetag{position:absolute;top:0;left:0;background:var(--orange);color:#fff;font-family:var(--disp);font-size:9px;font-weight:800;letter-spacing:.12em;padding:3px 9px;border-radius:0 0 8px 0;z-index:3}
  .card .ct{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px 11px;border-bottom:2px dashed var(--line);gap:10px}
  .card .tname{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:16px;line-height:1.1}
  .card .ttype{font-size:10.5px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
  .card .unit{font-size:10px;color:var(--gray);margin-top:3px;font-variant-numeric:tabular-nums}
  .pill{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:10px;padding:5px 10px;border-radius:20px;cursor:pointer;white-space:nowrap;border:1.5px solid;user-select:none;transition:.15s;display:inline-flex;align-items:center;gap:5px}
  .pill:hover{transform:scale(1.05)}
  .pill .pd{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
  .pill.staged{color:#6a6048;border-color:#b3a582;background:#ece4d1}
  .pill.enroute{color:#fff;background:var(--blue);border-color:var(--blue)}
  .pill.onloc{color:#fff;background:var(--orange);border-color:var(--orange)}
  .pill.wrapped{color:#fff;background:var(--green);border-color:var(--green)}
  .route{padding:11px 14px;display:flex;align-items:center;gap:8px;font-size:13px;border-bottom:1px solid var(--line)}
  .route .loc{flex:1;min-width:0}
  .route .loc small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}
  .route .loc b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .route .arrw{font-size:19px;color:var(--orange);font-weight:700;flex:none}
  .missing{color:var(--red);font-style:italic}
  .times{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .times div{padding:8px 6px;text-align:center;border-right:1px solid var(--line)}
  .times div:last-child{border-right:none}
  .times small{display:block;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin-bottom:2px}
  .times b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .flags{display:flex;flex-wrap:wrap;gap:5px;padding:9px 14px 0}
  .flags:empty{display:none}
  .flg{font-size:9.5px;font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1.5px solid;display:inline-flex;align-items:center;gap:4px}
  .flg.c{color:var(--red);border-color:var(--red);background:#fae7e3}
  .flg.w{color:var(--amber);border-color:var(--amber);background:#f7edcf}
  .flg.ok{color:var(--green);border-color:var(--green);background:#e2eedd}
  .cfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 12px;font-size:12px;gap:10px}
  .cfoot .driver{display:flex;align-items:center;gap:6px;min-width:0}
  .cfoot .driver .warn{color:var(--red);font-weight:700}
  .fuel{display:flex;align-items:center;gap:7px}
  .fuel .fbar{width:54px;height:8px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:#e9e1cd;position:relative}
  .fuel .fbar i{display:block;height:100%;background:var(--green);transition:width .4s}
  .fuel .fbar i.low{background:var(--amber)}
  .fuel .fbar i.crit{background:var(--red)}
  .fuel .fl{font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .card .edit{position:absolute;top:9px;right:9px;opacity:0;transition:.15s;padding:5px 10px;font-size:10px}
  .card:hover .edit{opacity:1}
  .empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--ink-soft);border:2px dashed var(--line);border-radius:var(--rad)}

  /* ---------- week ---------- */
  .weekwrap{overflow-x:auto;border:2px solid var(--ink);border-radius:var(--rad);background:var(--card);box-shadow:var(--shadow)}
  table.week{border-collapse:collapse;width:100%;min-width:860px}
  table.week th,table.week td{border:1px solid var(--line);padding:0;vertical-align:top}
  table.week thead th{background:var(--ink);color:var(--paper);font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:11px;padding:8px 6px;position:sticky;top:0}
  table.week thead th.today{background:var(--orange)}
  table.week thead th small{display:block;font-weight:400;font-size:9px;color:#C9BEA3;letter-spacing:.1em;margin-top:2px}
  table.week thead th.today small{color:#ffe8dc}
  table.week th.rowhead{background:var(--card);color:var(--ink);text-align:left;padding:8px 10px;font-family:var(--disp);font-size:12px;min-width:160px;position:sticky;left:0;z-index:2}
  td.dropcell{padding:5px;height:100%}
  td.dropcell.drop-ok{background:#FBEFD9;box-shadow:inset 0 0 0 2px var(--orange)}
  .wchip{position:relative;display:block;border-radius:9px;padding:8px 9px 8px 22px;cursor:grab;border:1px solid rgba(25,21,16,.12);line-height:1.25;transition:transform .12s, box-shadow .12s}
  .wchip:hover{transform:translateY(-1px);box-shadow:0 4px 12px -6px rgba(0,0,0,.4)}
  .wchip:active{cursor:grabbing}
  .wchip.dragging{opacity:.35}
  .wchip .grip{position:absolute;left:6px;top:7px;font-size:13px;color:rgba(25,21,16,.32);letter-spacing:-2px;line-height:1}
  .wchip .wtime{display:block;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
  .wchip .wto{display:block;font-size:11px;margin-top:2px}
  .cs-staged{background:#EAE3D2;color:#5A5140}
  .cs-enroute{background:#DCE6F3;color:#28486F}
  .cs-onloc{background:#F6E1CC;color:#8A461C}
  .cs-wrapped{background:#DDEBDC;color:#2A6544}
  .wchip .missing{color:var(--red);font-style:italic}
  .wblank{display:flex;align-items:center;justify-content:center;min-height:56px;color:var(--line);font-size:22px;cursor:pointer;border-radius:9px;height:100%;transition:.14s}
  .wblank:hover{background:#fffcf3;color:var(--orange)}
  .wload{grid-column:1;font-size:9px;text-align:center;padding:2px;color:var(--gray);font-family:var(--disp);letter-spacing:.06em;text-transform:uppercase}

  /* nav menu */
  .navtool{margin-left:auto;position:relative;display:flex;align-items:center}
  #menuBtn{background:none;border:none;color:#B7A986;font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:700;padding:12px 16px;cursor:pointer}
  #menuBtn:hover{color:#fff}
  .boardmenu{position:absolute;right:6px;top:46px;background:var(--paper);border:2px solid var(--ink);border-radius:var(--rad);min-width:230px;z-index:60;display:none;overflow:hidden;box-shadow:var(--shadow-lg)}
  .boardmenu.show{display:block}
  .boardmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);letter-spacing:0}
  .boardmenu button:last-child{border-bottom:none;color:var(--red);font-weight:700}
  .boardmenu button:hover{background:var(--paper-2)}

  /* ---------- crew ---------- */
  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .rcard{background:var(--card);border:2px solid var(--ink);border-radius:var(--rad);padding:14px;box-shadow:var(--shadow)}
  .rcard h4{margin:0 0 3px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:15px}
  .rcard .rtype{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
  .rcard .person{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
  .rcard .person:first-of-type{border-top:none}
  .rcard .badge{font-family:var(--disp);font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:12px;border:1.5px solid;flex:none}
  .badge.driver{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .badge.crew{background:var(--card);color:var(--ink-soft);border-color:var(--line-strong)}
  .badge.none{background:#f7dede;color:var(--red);border-color:var(--red)}
  .hours{margin-top:10px;padding-top:9px;border-top:2px solid var(--line)}
  .hours .hrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:2px 0}
  .hours .hrow .lab{color:var(--ink-soft);letter-spacing:.04em}
  .hours .hrow .val{font-weight:700;font-variant-numeric:tabular-nums}
  .hours .hrow .val.c{color:var(--red)}
  .hours .hrow .val.w{color:var(--amber)}
  .hbar{height:7px;border-radius:4px;background:#e9e1cd;overflow:hidden;margin-top:5px;border:1px solid var(--line)}
  .hbar i{display:block;height:100%;background:var(--green)}
  .hbar i.w{background:var(--amber)}
  .hbar i.c{background:var(--red)}

  /* ---------- fleet ---------- */
  .fleetwrap{overflow-x:auto;border:2px solid var(--ink);border-radius:var(--rad);background:var(--card);box-shadow:var(--shadow)}
  table.fleet{border-collapse:collapse;width:100%;min-width:820px}
  table.fleet th{background:var(--ink);color:var(--paper);font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:11px;padding:9px 10px;text-align:left}
  table.fleet td{border-bottom:1px solid var(--line);padding:9px 10px;font-size:13px;vertical-align:top}
  table.fleet tr:hover td{background:#fffcf3}
  .flag{color:var(--red);font-weight:700}
  .minifuel{display:flex;align-items:center;gap:6px}
  .minifuel .fbar{width:46px;height:7px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:#e9e1cd}
  .minifuel .fbar i{display:block;height:100%;background:var(--green)}
  .minifuel .fbar i.low{background:var(--amber)}
  .minifuel .fbar i.crit{background:var(--red)}

  /* ---------- modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(25,21,16,.58);display:none;align-items:center;justify-content:center;z-index:70;padding:20px;backdrop-filter:blur(2px)}
  .modal-bg.show{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--paper);border:3px solid var(--ink);border-radius:8px;max-width:580px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{transform:scale(.94) translateY(8px);opacity:.6}to{transform:none;opacity:1}}
  .modal .mh{background:var(--ink);color:var(--paper);padding:14px 18px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-weight:800;display:flex;justify-content:space-between;align-items:center}
  .modal .mh .x{cursor:pointer;font-size:22px;line-height:1}
  .modal .mb{padding:18px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700;margin-bottom:4px;color:var(--ink-soft)}
  .fld input,.fld select,.fld textarea{width:100%;border:2px solid var(--line-strong);background:var(--card);padding:8px 10px;font-family:var(--mono);font-size:13px;border-radius:4px;color:var(--ink)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--orange)}
  .fld textarea{resize:vertical;min-height:52px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .mfoot{display:flex;justify-content:space-between;gap:10px;margin-top:6px;align-items:center}
  .link-danger{background:none;border:none;color:var(--red);font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:11px;cursor:pointer}

  .footer-note{text-align:center;color:var(--gray);font-size:11px;margin-top:22px;letter-spacing:.03em}

  /* ---------- setup wizard ---------- */
  .setup{max-width:680px;margin:6px auto 0}
  .setupcard{background:var(--card);border:2px solid var(--ink);border-radius:var(--rad);box-shadow:var(--shadow-lg);overflow:hidden}
  .setuphd{background:linear-gradient(180deg,#3A2F1F,#2A2213);color:var(--paper);padding:16px 20px;border-bottom:2px solid rgba(206,90,47,.5)}
  .setuphd h2{margin:0;font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
  .setuphd p{margin:5px 0 0;color:#C9BEA3;font-size:12.5px}
  .setupbody{padding:18px 20px;display:flex;flex-direction:column;gap:15px}
  .segbar{display:flex;gap:5px;padding:5px;background:var(--paper-2);border:1.5px solid var(--line);border-radius:9px}
  .seg{flex:1;border:none;background:none;cursor:pointer;padding:9px;font-size:11.5px;font-weight:700;color:var(--ink-soft);border-radius:6px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;transition:.15s}
  .seg[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .modebar{display:flex;gap:8px}
  .modebar .seg{border:1.5px solid var(--line-strong);border-radius:7px;background:var(--card)}
  .modebar .seg[aria-selected="true"]{background:var(--orange);color:#fff;border-color:var(--orange)}
  .sfield{display:flex;flex-direction:column;gap:6px}
  .sfield label{font-size:11px;font-weight:700;color:var(--ink-soft);font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em}
  .sfield input,.sfield select,.sfield textarea{font-family:var(--mono);font-size:13px;border:2px solid var(--line-strong);background:var(--card);padding:9px 11px;border-radius:5px;color:var(--ink)}
  .sfield input:focus,.sfield textarea:focus{outline:none;border-color:var(--orange)}
  .sfield textarea{resize:vertical;min-height:108px;font-size:12.5px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .num{display:flex;width:fit-content;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
  .num button{border:none;background:var(--paper-2);width:42px;height:44px;font-size:22px;cursor:pointer;color:var(--ink);font-family:var(--disp);line-height:1}
  .num button:hover{background:var(--orange);color:#fff}
  .num input{border:none;width:66px;text-align:center;font-family:var(--disp);font-size:20px;font-weight:800;border-left:2px solid var(--ink);border-right:2px solid var(--ink);background:var(--card);color:var(--ink)}
  .num input:focus{outline:none}
  .checks{display:flex;flex-wrap:wrap;gap:7px;border:2px solid var(--line-strong);border-radius:6px;padding:11px;background:var(--card)}
  .chk{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;border:1.5px solid var(--line-strong);border-radius:20px;padding:6px 11px;cursor:pointer;color:var(--ink-soft);font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em}
  .chk.on{background:var(--orange);border-color:var(--orange);color:#fff}
  .chk input{accent-color:var(--orange)}
  .shint{font-size:12px;color:var(--gray);line-height:1.5}
  .stepper{display:flex;gap:6px;margin-bottom:2px}
  .sdot{flex:1;height:5px;border-radius:3px;background:var(--line-soft)}
  .sdot.on{background:var(--orange)}.sdot.done{background:var(--green)}
  .review{background:var(--paper-2);border:2px solid var(--line);border-radius:6px;padding:14px 16px;font-size:13.5px;line-height:1.75}
  .csv-ex{font-family:var(--mono);font-size:11.5px;background:var(--paper-2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;color:var(--ink-soft);white-space:pre;overflow-x:auto}
  .setupfoot{display:flex;gap:10px;align-items:center;padding:15px 20px;border-top:2px dashed var(--line);background:var(--card-2)}
  .setupfoot .sp{flex:1}
  .pill-note{display:inline-flex;align-items:center;gap:5px;background:#DDEBDC;color:var(--green);border:1.5px solid var(--green);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:var(--disp);letter-spacing:.04em}

  /* ---------- softer surfaces pass ---------- */
  .stat,.card,.tlwrap,.weekwrap,.rcard,.fleetwrap,.setupcard{border:1px solid var(--line)}
  .card .ct{border-bottom:1px solid var(--line-soft)}
  .tlrow{border-bottom:1px solid var(--line-soft)}
  .modal{border:1.5px solid var(--line-strong)}
  .datestep .arrow{border:1.5px solid var(--line-strong)}
  .card.due{outline-width:2px}
  .stat::before{border-radius:0 3px 3px 0}
  .times div{border-color:var(--line-soft)}
  .times{border-bottom-color:var(--line-soft)}
  .route{border-bottom-color:var(--line-soft)}

  /* ============ REFINEMENT PASS · softer, more Apple ============ */
  :root{
    --paper:#F2ECDF;
    --card:#FDFBF6;
    --card-2:#F7F2E8;
    --ink:#1C1A17;                 /* rich near-black, restored */
    --ink-soft:#6B6353;
    --line:rgba(28,26,23,.10);
    --line-soft:rgba(28,26,23,.06);
    --line-strong:rgba(28,26,23,.17);
    --rad:14px;
    --uifont:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;
    --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(28,26,23,.05),0 10px 24px -16px rgba(28,26,23,.20);
    --shadow-lg:0 22px 52px -26px rgba(28,26,23,.32),0 2px 8px -4px rgba(28,26,23,.10);
  }
  body{font-family:var(--uifont);letter-spacing:0;color:var(--ink)}

  /* de-shout: drop the condensed all-caps treatment everywhere */
  .brand h1,.brand .tag,nav button.tab,.chip,.btn,.pill,.stat .k,.subhdr,
  .tlhead .tt,.tlhead .lg,.route .loc small,.times small,.card .tname,.card .ttype,
  .card .unit,.rcard h4,.rcard .rtype,.badge,.flg,.seg,.sfield label,.chk,
  .datestep .curdate,.datestep .curdate small,.alerts .ah,.alerttoggle,.duetag,
  .pill-note,.tlrow .rl .nm,.tlrow .rl .dv,.stat .sub,.hours .hrow .lab,
  table.week thead th,table.week th.rowhead,table.fleet th,.modal .mh,.setuphd h2{
    text-transform:none;letter-spacing:0;
  }

  /* SF-style headings: tight tracking, medium weight (not 800) */
  .brand h1{font-weight:700;font-size:18px;letter-spacing:-.015em}
  .brand .tag{letter-spacing:.01em;font-size:11px}
  nav button.tab{font-weight:500;letter-spacing:-.003em;font-size:13px}
  .datestep .curdate{font-weight:700;font-size:18px;letter-spacing:-.015em}
  .datestep .curdate small{font-weight:500}
  .subhdr{font-weight:600;letter-spacing:-.005em;color:var(--ink-soft)}
  .subhdr::after{background:var(--line)}
  .card .tname,.rcard h4,.tlhead .tt,.modal .mh,.setuphd h2{font-weight:600;letter-spacing:-.01em}
  .stat .v{font-weight:700;font-size:21px;letter-spacing:-.02em}
  .stat .k{font-weight:600;font-size:11px;color:var(--ink-soft)}
  .alerts .ah{font-weight:600;letter-spacing:-.005em}

  /* surfaces: hairline + soft shadow + rounder, floating not boxed */
  .stat,.card,.tlwrap,.weekwrap,.rcard,.fleetwrap,.setupcard,.modal,.boardmenu{
    border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);
  }
  .modal{box-shadow:var(--shadow-lg)}
  .card .ct{border-bottom:1px solid var(--line-soft)}
  .tlrow{border-bottom:1px solid var(--line-soft)}

  /* darks: rich near-black restored */
  header{background:linear-gradient(180deg,#242220,#141312);border-bottom:1px solid rgba(206,90,47,.4);box-shadow:0 10px 30px -26px rgba(0,0,0,.9)}
  .setuphd{background:linear-gradient(180deg,#242220,#141312);border-bottom:1px solid rgba(206,90,47,.4)}
  .tlhead,.modal .mh,table.week thead th,table.fleet th{background:#201E1C}
  nav{border-top:1px solid rgba(255,255,255,.05)}

  /* breathing room */
  main{padding:24px 26px}
  .grid{gap:16px}
  .deck{gap:13px;margin-bottom:20px}
  .toolbar{margin-bottom:18px}

  /* stat tiles: slimmer, less slab */
  .stat{padding:13px 15px}
  .stat::before{top:13px;bottom:13px;width:3px;border-radius:3px}

  /* controls: lighter, softer, quieter */
  .btn{background:#201E1C;border:1px solid transparent;border-radius:10px;font-weight:600;padding:8px 14px;box-shadow:0 1px 2px rgba(28,26,23,.14)}
  .btn:hover{transform:none}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{background:var(--card-2);color:var(--ink)}
  .chip{border:1px solid var(--line);border-radius:9px;font-weight:600;padding:6px 11px}
  .chip:hover{border-color:var(--line-strong)}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .pill{border:1px solid transparent;border-radius:8px;font-weight:600}
  .pill.staged{background:#EDE7D8;color:#6B6353;border-color:transparent}
  .pill:hover{transform:none}
  .sevpill{font-weight:600;border-radius:9px}
  .sevpill:hover{transform:none}
  .alerttoggle{font-weight:600;border-radius:9px;border:1px solid var(--line);letter-spacing:0}
  .flg{border-width:1px;border-radius:7px;font-weight:600}
  .badge{font-weight:600}
  .seg{font-weight:600;letter-spacing:0}
  .datestep .arrow{border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .datestep .arrow:hover{background:var(--ink)}

  /* timeline & alert chips: gentler */
  .bar{border-radius:7px;border:1px solid rgba(0,0,0,.10)}
  .alerts li{border-radius:10px;box-shadow:none}
  .alerts{box-shadow:0 14px 26px -22px rgba(28,26,23,.35)}
  .fld input,.fld select,.sfield input,.sfield select{font-family:var(--uifont)}

  /* ---------- print ---------- */
  @media print{
    header nav,.toolbar .filters,.toolbar .datestep .arrow,.btn,.card .edit,#menuBtn,.tlhead .lg{display:none!important}
    body{background:#fff;padding:0;font-size:11px}
    header{position:static;background:#fff;color:#000;border-bottom:2px solid #000}
    .brand h1,.brand .tag,.clock,.clock .big{color:#000}
    .brand h1 .beacon{display:none}
    .alerts{background:#fff!important;border:1px solid #000}
    main{max-width:100%;padding:10px}
    .deck{display:none}
    .grid{grid-template-columns:repeat(2,1fr);gap:8px}
    .card{break-inside:avoid;box-shadow:none;border:1.5px solid #000;opacity:1!important;transform:none!important;animation:none!important}
    .tlwrap{break-inside:avoid;box-shadow:none}
    .tlhead{background:#fff;color:#000;border-bottom:1px solid #000}
    .bar{animation:none!important}
    .pill{border:1px solid #000!important;background:#fff!important;color:#000!important}
    .datestep .curdate{color:#000}
  }
</style>
</head>
<body>
<header>
  <div class="head-top">
    <div class="brand">
      <h1><span class="beacon"></span>Transpo Board</h1>
      <span class="tag">Dispatch &middot; Fleet &middot; Crew</span>
    </div>
    <div class="clock">
      <span class="big" id="clockTime">--:--</span><br>
      <span id="clockDate">&mdash;</span>
    </div>
  </div>
  <nav>
    <button class="tab" data-view="daily">Dispatch</button>
    <button class="tab" data-view="week">Week</button>
    <button class="tab" data-view="crew">Crew &amp; Hours</button>
    <button class="tab" data-view="fleet">Fleet</button>
    <div class="navtool">
      <button id="menuBtn">&#8942; Board</button>
      <div class="boardmenu" id="boardMenu">
        <button data-act="setup">&#9889; Set up / generate board</button>
        <button data-act="sample">Reset to sample data</button>
        <button data-act="clearmoves">Clear all moves (keep trucks)</button>
        <button data-act="fresh">Start fresh &mdash; empty board</button>
      </div>
    </div>
  </nav>
</header>

<div id="alertBar"></div>
<main id="app"></main>

<!-- Move editor modal -->
<div class="modal-bg" id="moveModal">
  <div class="modal">
    <div class="mh"><span id="moveModalTitle">Edit Move</span><span class="x" data-close>&times;</span></div>
    <div class="mb">
      <div class="fld"><label>Truck</label><select id="mv_truck"></select></div>
      <div class="fld"><label>Date</label><input type="date" id="mv_date"></div>
      <div class="row2">
        <div class="fld"><label>From</label><input id="mv_from" placeholder="e.g. Base Camp"></div>
        <div class="fld"><label>To (destination)</label><input id="mv_to" placeholder="e.g. Location 3 - Pier"></div>
      </div>
      <div class="row3">
        <div class="fld"><label>Roll-out</label><input type="time" id="mv_roll"></div>
        <div class="fld"><label>On-set call</label><input type="time" id="mv_call"></div>
        <div class="fld"><label>Wrap</label><input type="time" id="mv_wrap"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>Est. drive time (min)</label><input type="number" id="mv_drive" min="0" placeholder="e.g. 35"></div>
        <div class="fld"><label>Crew on board</label><input type="number" id="mv_crew" min="0" placeholder="#"></div>
      </div>
      <div class="fld"><label>Status</label>
        <select id="mv_status">
          <option value="staged">Staged</option>
          <option value="enroute">En route</option>
          <option value="onloc">On location</option>
          <option value="wrapped">Wrapped</option>
        </select>
      </div>
      <div class="mfoot">
        <button class="link-danger" id="mv_delete">Delete move</button>
        <div>
          <button class="btn ghost" data-close>Cancel</button>
          <button class="btn" id="mv_save">Save move</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Truck editor modal -->
<div class="modal-bg" id="truckModal">
  <div class="modal">
    <div class="mh"><span id="truckModalTitle">Edit Truck</span><span class="x" data-close>&times;</span></div>
    <div class="mb">
      <div class="row2">
        <div class="fld"><label>Name</label><input id="tk_name" placeholder="e.g. Camera Truck"></div>
        <div class="fld"><label>Type</label><input id="tk_type" placeholder="e.g. 10-ton truck"></div>
      </div>
      <div class="fld"><label>Unit / Plate</label><input id="tk_unit" placeholder="e.g. TR-04 - 8XKL229"></div>
      <div class="fld"><label>Driver</label><input id="tk_driver" placeholder="Leave blank if unassigned"></div>
      <div class="fld"><label>Extra crew (comma separated)</label><input id="tk_crew" placeholder="e.g. J. Rivera, P. Ng"></div>
      <div class="row2">
        <div class="fld"><label>Fuel level (%)</label><input type="number" id="tk_fuel" min="0" max="100" placeholder="0-100"></div>
        <div class="fld"><label>Odometer (mi)</label><input type="number" id="tk_odo" min="0" placeholder="e.g. 84210"></div>
      </div>
      <div class="fld"><label>Notes</label><textarea id="tk_notes" placeholder="Liftgate, refrigerated, etc."></textarea></div>
      <div class="mfoot">
        <button class="link-danger" id="tk_delete">Delete truck</button>
        <div>
          <button class="btn ghost" data-close>Cancel</button>
          <button class="btn" id="tk_save">Save truck</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Person editor modal -->
<div class="modal-bg" id="personModal">
  <div class="modal">
    <div class="mh"><span id="personModalTitle">Edit Person</span><span class="x" data-close>&times;</span></div>
    <div class="mb">
      <div class="fld"><label>Name</label><input id="pr_name" placeholder="e.g. Danny Ortiz"></div>
      <div class="row2">
        <div class="fld"><label>Role</label><input id="pr_role" placeholder="e.g. Driver, Grip, Costumer"></div>
        <div class="fld"><label>Phone</label><input id="pr_phone" placeholder="e.g. 555-0100"></div>
      </div>
      <div class="hint" style="font-size:11px;color:var(--gray);margin:-6px 0 12px">Renaming a driver here updates their unit assignments too.</div>
      <div class="mfoot">
        <button class="link-danger" id="pr_delete">Remove from roster</button>
        <div>
          <button class="btn ghost" data-close>Cancel</button>
          <button class="btn" id="pr_save">Save person</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
